<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Logos — Remedy Database</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="apple-touch-icon" href="/favicon.svg">  <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=Josefin+Sans:wght@200;300;400&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --cream: #f5f0e8; --parchment: #ede4d0; --ink: #1a1208;
      --forest: #2c4a2e; --sage: #5a7a5c; --moss: #3d5c3e;
      --gold: #b8922a; --amber: #c9a84c; --rust: #8b3a2a;
      --muted: #7a6e5f; --border: rgba(90,122,92,0.3);
    }
    html, body, #root { height: 100%; }
    body { background: var(--cream); font-family: 'Josefin Sans', sans-serif; color: var(--ink); }
    .app { display: flex; flex-direction: column; height: 100vh; background: var(--cream);
      background-image: radial-gradient(ellipse at 10% 20%, rgba(90,122,92,0.08) 0%, transparent 50%),
        radial-gradient(ellipse at 90% 80%, rgba(184,146,42,0.06) 0%, transparent 50%); }
    .header { background: linear-gradient(135deg, #1e3520 0%, #2c4a2e 50%, #1e3520 100%);
      padding: 18px 32px; flex-shrink: 0; }
    .header-inner { max-width: 800px; margin: 0 auto; display: flex; align-items: center; gap: 14px; }
    .brand-icon { width: 42px; height: 42px; background: rgba(184,146,42,0.2);
      border: 1px solid rgba(184,146,42,0.5); border-radius: 50%; display: flex;
      align-items: center; justify-content: center; font-size: 20px; flex-shrink: 0; }
    .brand-name { font-family: 'Cormorant Garamond', serif; font-size: 26px; font-weight: 300;
      color: var(--cream); letter-spacing: 2px; line-height: 1; }
    .brand-sub { font-size: 10px; letter-spacing: 3px; color: var(--amber); text-transform: uppercase; margin-top: 3px; }
    .tabs { display: flex; background: var(--parchment); border-bottom: 2px solid var(--border); flex-shrink: 0; }
    .trial-banner { background: rgba(44,74,46,0.1); color: var(--forest); font-family: 'Josefin Sans', sans-serif; font-size: 11px; letter-spacing: 1px; text-align: center; padding: 7px 12px; border-bottom: 1px solid var(--border); flex-shrink: 0; }
    .tabs-inner { max-width: 800px; width: 100%; margin: 0 auto; display: flex; }
    .tab { flex: 1; padding: 13px 20px; background: none; border: none; cursor: pointer;
      font-family: 'Josefin Sans', sans-serif; font-size: 11px; letter-spacing: 2px;
      text-transform: uppercase; color: var(--muted); border-bottom: 2px solid transparent;
      margin-bottom: -2px; transition: all 0.2s; }
    .tab:hover { color: var(--forest); }
    .tab.active { color: var(--forest); border-bottom-color: var(--gold); font-weight: 400; }
    .main { flex: 1; overflow: hidden; display: flex; flex-direction: column; }
    .panel { max-width: 800px; width: 100%; margin: 0 auto; flex: 1;
      display: flex; flex-direction: column; overflow: hidden; }

    /* ── CHAT ── */
    .chat-area { display: flex; flex-direction: column; flex: 1; overflow: hidden; }
    .messages { flex: 1; overflow-y: auto; padding: 20px 24px; display: flex;
      flex-direction: column; gap: 16px; scrollbar-width: thin; scrollbar-color: var(--border) transparent; }
    .msg { display: flex; gap: 12px; animation: fadeUp 0.3s ease; }
    @keyframes fadeUp { from { opacity:0; transform:translateY(8px); } to { opacity:1; transform:translateY(0); } }
    .msg.user { flex-direction: row-reverse; }
    .avatar { width: 34px; height: 34px; border-radius: 50%; display: flex; align-items: center;
      justify-content: center; font-size: 16px; flex-shrink: 0; margin-top: 2px; }
    .msg.assistant .avatar { background: var(--forest); }
    .msg.user .avatar { background: var(--parchment); border: 1px solid var(--border); }
    .bubble { max-width: 78%; padding: 14px 18px; line-height: 1.75; font-size: 14px; letter-spacing: 0.3px; }
    .msg.assistant .bubble { background: #fff; border: 1px solid var(--border);
      border-radius: 2px 16px 16px 16px; box-shadow: 0 2px 8px rgba(44,74,46,0.06); }
    .msg.user .bubble { background: var(--forest); color: var(--cream); border-radius: 16px 2px 16px 16px; }

    /* Markdown inside bubbles */
    .bubble strong { color: var(--gold); font-weight: 600; }
    .msg.user .bubble strong { color: var(--amber); }
    .bubble em { font-style: italic; color: var(--sage); }
    .bubble ul { margin: 8px 0 8px 18px; }
    .bubble ol { margin: 8px 0 8px 18px; }
    .bubble li { margin: 4px 0; line-height: 1.6; }
    .bubble p { margin: 6px 0; }
    .bubble p:first-child { margin-top: 0; }
    .bubble p:last-child { margin-bottom: 0; }
    .bubble h3 { font-family: 'Cormorant Garamond', serif; font-size: 17px; color: var(--forest);
      font-weight: 400; margin: 10px 0 4px; }
    .bubble blockquote { border-left: 2px solid var(--gold); padding-left: 10px;
      color: var(--muted); font-style: italic; margin: 8px 0; }
    .bubble hr { border: none; border-top: 1px solid var(--border); margin: 10px 0; }
    .bubble code { background: var(--parchment); padding: 1px 5px; border-radius: 3px;
      font-family: monospace; font-size: 12px; }

    .disclaimer { font-size: 11px; color: var(--muted); font-style: italic; margin-top: 8px;
      padding: 7px 12px; background: rgba(184,146,42,0.08);
      border-left: 2px solid var(--gold); border-radius: 0 4px 4px 0; }

    .quick-chips { display: flex; flex-wrap: wrap; gap: 7px; padding: 12px 24px 4px; flex-shrink: 0; }
    .chip { background: #fff; border: 1px solid var(--border); border-radius: 20px;
      padding: 5px 13px; font-size: 11px; letter-spacing: 0.5px; color: var(--forest);
      cursor: pointer; transition: all 0.2s; font-family: 'Josefin Sans', sans-serif; }
    .chip:hover { background: var(--parchment); border-color: var(--sage); }

    .input-row { padding: 12px 24px 16px; background: transparent;
      border-top: none; display: flex; gap: 10px; flex-shrink: 0; align-items: flex-end; width: 100%; }
    .input-wrap { flex: 1; min-width: 0; overflow: visible; }
    textarea { width: 100%; padding: 11px 15px; background: #fff; border: 1px solid var(--border);
      border-radius: 8px; font-family: 'Josefin Sans', sans-serif; font-size: 16px;
      color: var(--ink); outline: none; resize: none; min-height: 56px; max-height: 120px;
      line-height: 1.5; transition: border-color 0.2s; letter-spacing: 0.3px; overflow-y: hidden; box-sizing: border-box; }
    textarea:focus { border-color: var(--sage); }
    textarea::placeholder { color: var(--muted); }
    .send-btn { padding: 0 20px; background: var(--forest); color: var(--cream); border: none;
      border-radius: 8px; cursor: pointer; font-family: 'Josefin Sans', sans-serif;
      font-size: 11px; letter-spacing: 2px; text-transform: uppercase; min-width: 78px;
      height: 44px; flex-shrink: 0; transition: background 0.2s; }
    .send-btn:hover:not(:disabled) { background: var(--moss); }
    .send-btn:disabled { opacity: 0.5; cursor: not-allowed; }

    /* Typing dots */
    .dots span { animation: blink 1.4s infinite; font-size: 18px; color: var(--sage); }
    .dots span:nth-child(2) { animation-delay: 0.2s; }
    .dots span:nth-child(3) { animation-delay: 0.4s; }
    @keyframes blink { 0%,80%,100%{opacity:0.2;} 40%{opacity:1;} }

    /* ── COUGH PANEL ── */
    .cough-panel { flex: 1; overflow-y: auto; padding: 20px 24px; display: flex;
      flex-direction: column; gap: 18px; }
    .card { background: #fff; border: 1px solid var(--border); border-radius: 12px;
      padding: 22px; box-shadow: 0 2px 12px rgba(44,74,46,0.06); }
    .card h3 { font-family: 'Cormorant Garamond', serif; font-size: 22px; font-weight: 400;
      color: var(--forest); margin-bottom: 6px; }
    .card p { font-size: 12px; color: var(--muted); letter-spacing: 0.5px; line-height: 1.6; margin-bottom: 18px; }
    .recorder-area { background: var(--parchment); border: 1px dashed var(--border);
      border-radius: 8px; padding: 24px; display: flex; flex-direction: column;
      align-items: center; gap: 14px; }
    .rec-btn { width: 76px; height: 76px; border-radius: 50%; border: 3px solid var(--forest);
      background: #fff; cursor: pointer; display: flex; align-items: center;
      justify-content: center; font-size: 30px; transition: all 0.2s; }
    .rec-btn:hover { background: var(--parchment); transform: scale(1.05); }
    .rec-btn.recording { border-color: var(--rust); background: rgba(139,58,42,0.08);
      animation: pulse 1.5s infinite; }
    @keyframes pulse { 0%,100%{box-shadow:0 0 0 0 rgba(139,58,42,0.3);} 50%{box-shadow:0 0 0 14px rgba(139,58,42,0);} }
    .rec-label { font-size: 11px; letter-spacing: 2px; text-transform: uppercase; color: var(--muted); }
    .rec-timer { font-family: 'Cormorant Garamond', serif; font-size: 34px; color: var(--rust); font-weight: 300; }
    .waveform { width: 100%; height: 52px; display: flex; align-items: center;
      justify-content: center; gap: 3px; background: rgba(255,255,255,0.5); border-radius: 6px; padding: 6px 10px; }
    .bar { width: 3px; background: var(--sage); border-radius: 2px; transition: height 0.05s; min-height: 3px; }
    .divider { text-align: center; font-size: 11px; color: var(--muted); letter-spacing: 2px; padding: 4px 0; }
    .upload-zone { border: 1px dashed var(--border); border-radius: 8px; padding: 18px;
      text-align: center; cursor: pointer; transition: all 0.2s; background: #fff; }
    .upload-zone:hover { border-color: var(--sage); background: var(--parchment); }
    .upload-zone p { margin: 0; font-size: 12px; color: var(--muted); letter-spacing: 0.5px; }
    audio { width: 100%; border-radius: 6px; margin-top: 10px; }
    .metrics { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin: 14px 0; }
    .metric { background: var(--parchment); border-radius: 8px; padding: 12px; text-align: center; }
    .metric-val { font-family: 'Cormorant Garamond', serif; font-size: 22px; color: var(--forest); font-weight: 300; }
    .metric-label { font-size: 9px; letter-spacing: 1.5px; text-transform: uppercase; color: var(--muted); margin-top: 2px; }
    .analyze-btn { width: 100%; padding: 13px; background: var(--forest); color: var(--cream);
      border: none; border-radius: 8px; cursor: pointer; font-family: 'Josefin Sans', sans-serif;
      font-size: 11px; letter-spacing: 3px; text-transform: uppercase; transition: background 0.2s; }
    .analyze-btn:hover:not(:disabled) { background: var(--moss); }
    .analyze-btn:disabled { opacity: 0.5; cursor: not-allowed; }
    .result-card { background: linear-gradient(135deg, rgba(44,74,46,0.05), rgba(184,146,42,0.05));
      border: 1px solid var(--border); border-radius: 12px; padding: 20px; animation: fadeUp 0.4s ease; }
    .result-card h4 { font-family: 'Cormorant Garamond', serif; font-size: 20px; font-weight: 400;
      color: var(--forest); margin-bottom: 10px; }
    .result-text { font-size: 13px; line-height: 1.8; color: var(--ink); }
    .result-text strong { color: var(--gold); font-weight: 600; }
    .result-text ul { margin: 8px 0 8px 18px; }
    .result-text li { margin: 4px 0; }
    .result-text p { margin: 6px 0; }
    .tags { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 12px; }
    .tag { padding: 3px 10px; border-radius: 20px; font-size: 11px; letter-spacing: 0.5px;
      background: rgba(90,122,92,0.12); color: var(--forest); }
    .chat-btn { width: 100%; margin-top: 14px; padding: 12px; background: var(--gold);
      color: #fff; border: none; border-radius: 8px; cursor: pointer;
      font-family: 'Josefin Sans', sans-serif; font-size: 11px; letter-spacing: 3px;
      text-transform: uppercase; transition: background 0.2s; }
    .chat-btn:hover { background: var(--amber); }
    .error-box { padding: 12px 16px; background: rgba(139,58,42,0.08);
      border: 1px solid rgba(139,58,42,0.3); border-radius: 8px;
      font-size: 12px; color: var(--rust); margin-top: 8px; }
    .perm-note { font-size: 11px; color: var(--muted); text-align: center; padding: 4px; }
    @media (prefers-color-scheme: dark) {
  :root {
    --cream: #1a1a14;
    --parchment: #242418;
    --ink: #e8e0d0;
    --border: rgba(90,122,92,0.4);
    --muted: #9a8e7f;
  }
   body { background: var(--cream); }
  .msg.assistant .bubble { background: #323226; }
  .bubble { color: var(--ink); }
  .msg.user .bubble { color: #f5f0e8; }
  .bubble h3 { color: #c9a84c; }
  textarea { background: #2a2a20; color: var(--ink); }
  .card { background: #2a2a20; }
  .upload-zone { background: #2a2a20; }
  .brand-name { color: #f5f0e8; }
  .brand-sub { color: var(--amber); }
  .tab { color: var(--muted); }
  .tab.active { color: var(--amber); }
  .send-btn { background: var(--sage); color: #fff; }
}

/* ── SIDEBAR ── */
.sidebar-overlay { position:fixed; inset:0; background:rgba(0,0,0,0.3); z-index:100; opacity:0; pointer-events:none; transition:opacity 0.2s; }
.sidebar-overlay.open { opacity:1; pointer-events:all; }
.sidebar { position:fixed; top:0; left:0; height:100vh; width:280px; background:var(--parchment); border-right:1px solid var(--border); z-index:101; transform:translateX(-100%); transition:transform 0.25s ease; display:flex; flex-direction:column; }
.sidebar.open { transform:translateX(0); }
.sidebar-header { padding:18px 16px; border-bottom:1px solid var(--border); display:flex; align-items:center; justify-content:space-between; flex-shrink:0; }
.sidebar-title { font-family:'Cormorant Garamond',serif; font-size:18px; font-weight:300; color:var(--forest); }
.sidebar-close { background:none; border:none; cursor:pointer; font-size:18px; color:var(--muted); padding:4px; }
.new-chat-btn { margin:12px; padding:10px; background:var(--forest); color:var(--cream); border:none; border-radius:8px; cursor:pointer; font-family:'Josefin Sans',sans-serif; font-size:11px; letter-spacing:2px; text-transform:uppercase; transition:background 0.2s; }
.new-chat-btn:hover { background:var(--moss); }
.conv-list { flex:1; overflow-y:auto; padding:8px; }
.conv-item { padding:10px 12px; border-radius:8px; cursor:pointer; transition:background 0.15s; margin-bottom:2px; }
.conv-item:hover { background:rgba(44,74,46,0.08); }
.conv-item.active { background:rgba(44,74,46,0.12); }
.conv-title { font-size:12px; color:var(--ink); letter-spacing:0.3px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.conv-row { display:flex; align-items:center; gap:6px; position:relative; }
.conv-row .conv-title { flex:1; min-width:0; }
.pin-ico { font-size:10px; margin-right:5px; }
.conv-menu-btn { background:none; border:none; cursor:pointer; color:var(--muted); font-size:17px; line-height:1; padding:0 4px; flex-shrink:0; opacity:0; transition:opacity 0.15s; }
.conv-item:hover .conv-menu-btn, .conv-item.active .conv-menu-btn { opacity:1; }
.conv-menu { position:absolute; top:24px; right:0; z-index:10; min-width:158px; padding:4px; background:var(--cream); border:1px solid var(--border); border-radius:8px; box-shadow:0 6px 18px rgba(26,18,8,0.2); display:flex; flex-direction:column; }
.conv-menu button { background:none; border:none; text-align:left; padding:8px 10px; font-family:'Josefin Sans',sans-serif; font-size:12px; letter-spacing:0.3px; color:var(--ink); cursor:pointer; border-radius:6px; }
.conv-menu button:hover { background:rgba(44,74,46,0.1); }
.conv-menu button.danger { color:var(--rust); }
.conv-menu button.danger:hover { background:rgba(139,58,42,0.1); }
.conv-rename-input { width:100%; box-sizing:border-box; padding:6px 8px; font-family:'Josefin Sans',sans-serif; font-size:12px; color:var(--ink); background:var(--cream); border:1px solid var(--sage); border-radius:6px; outline:none; }
.conv-group { margin-bottom:6px; }
.conv-group-label { display:flex; align-items:center; justify-content:space-between; gap:6px; font-size:10px; letter-spacing:1.5px; text-transform:uppercase; color:var(--forest); font-weight:600; padding:8px 12px 4px; }
.conv-group-name { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.folder-del-btn { background:none; border:none; cursor:pointer; color:var(--muted); font-size:16px; line-height:1; padding:0 2px; flex-shrink:0; opacity:0; transition:opacity 0.15s, color 0.15s; }
.conv-group:hover .folder-del-btn { opacity:1; }
.folder-del-btn:hover { color:var(--rust); }
.folder-overlay { position:fixed; inset:0; background:rgba(26,18,8,0.45); z-index:210; display:flex; align-items:center; justify-content:center; padding:20px; }
.folder-modal { width:100%; max-width:420px; max-height:85vh; display:flex; flex-direction:column; background:var(--parchment); border:1px solid var(--border); border-radius:14px; box-shadow:0 12px 40px rgba(26,18,8,0.35); overflow:hidden; }
.folder-modal-header { display:flex; align-items:center; justify-content:space-between; padding:16px 18px 6px; }
.folder-modal-title { font-family:'Cormorant Garamond',serif; font-size:22px; font-weight:300; color:var(--forest); }
.folder-modal-close { background:none; border:none; cursor:pointer; font-size:18px; color:var(--muted); padding:4px; }
.folder-modal-sub { padding:0 18px 12px; font-size:12px; color:var(--muted); font-style:italic; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.folder-scroll { overflow-y:auto; padding:0 18px; flex:1; }
.folder-section { margin-bottom:16px; }
.folder-section-label { font-size:10px; letter-spacing:1.5px; text-transform:uppercase; color:var(--forest); font-weight:600; margin-bottom:8px; }
.folder-chips { display:flex; flex-wrap:wrap; gap:8px; }
.folder-chip { padding:8px 14px; font-family:'Josefin Sans',sans-serif; font-size:12px; letter-spacing:0.3px; color:var(--forest); background:var(--cream); border:1px solid var(--border); border-radius:20px; cursor:pointer; transition:background 0.15s, border-color 0.15s; }
.folder-chip:hover { background:rgba(44,74,46,0.1); border-color:var(--sage); }
.folder-chip.active { background:var(--forest); color:var(--cream); border-color:var(--forest); }
.folder-create { display:flex; gap:8px; padding:14px 18px; border-top:1px solid var(--border); }
.folder-create-input { flex:1; min-width:0; padding:9px 12px; font-family:'Josefin Sans',sans-serif; font-size:12px; color:var(--ink); background:var(--cream); border:1px solid var(--border); border-radius:8px; outline:none; }
.folder-create-input:focus { border-color:var(--sage); }
.folder-create-btn { padding:9px 18px; background:var(--forest); color:var(--cream); border:none; border-radius:8px; cursor:pointer; font-family:'Josefin Sans',sans-serif; font-size:11px; letter-spacing:1.5px; text-transform:uppercase; transition:background 0.2s; }
.folder-create-btn:hover:not(:disabled) { background:var(--moss); }
.folder-create-btn:disabled { opacity:0.5; cursor:default; }
.folder-remove { margin:0 18px 16px; padding:9px; background:none; border:1px solid var(--border); border-radius:8px; color:var(--rust); font-family:'Josefin Sans',sans-serif; font-size:11px; letter-spacing:0.5px; cursor:pointer; }
.folder-remove:hover { background:rgba(139,58,42,0.08); }
.sidebar-btn { background:none; border:none; cursor:pointer; color:rgba(184,146,42,0.8); font-size:18px; padding:4px 8px; }

/* ── DISCLAIMER ── */
.disclaimer-screen { position:fixed; inset:0; background:var(--cream); z-index:200; display:flex; flex-direction:column; align-items:center; overflow-y:auto; padding:24px; -webkit-overflow-scrolling:touch; }.disclaimer-box { max-width:480px; width:100%; padding-bottom:40px; }
.disclaimer-icon { width:64px; height:64px; background:rgba(139,58,42,0.1); border-radius:50%; display:flex; align-items:center; justify-content:center; margin:0 auto 20px; font-size:28px; }
.disclaimer-title { font-family:'Cormorant Garamond',serif; font-size:28px; font-weight:300; color:var(--ink); text-align:center; margin-bottom:20px; }
.disclaimer-content { background:var(--parchment); border-radius:12px; padding:20px; margin-bottom:16px; }
.disclaimer-content p { font-size:13px; color:var(--muted); line-height:1.7; margin-bottom:14px; }
.disclaimer-content ul { list-style:disc; padding-left:18px; }
.disclaimer-content li { font-size:13px; color:var(--muted); line-height:1.7; margin-bottom:10px; }
.disclaimer-emergency { background:rgba(139,58,42,0.08); border:1px solid rgba(139,58,42,0.2); border-radius:8px; padding:12px 16px; display:flex; align-items:flex-start; gap:10px; margin-top:12px; }
.disclaimer-emergency p { font-size:12px; color:var(--rust); margin:0; font-weight:600; letter-spacing:0.3px; }
.disclaimer-agree-btn { width:100%; padding:16px; background:var(--forest); color:var(--cream); border:none; border-radius:12px; cursor:pointer; font-family:'Josefin Sans',sans-serif; font-size:12px; letter-spacing:3px; text-transform:uppercase; transition:background 0.2s; margin-top:8px; }
.disclaimer-agree-btn:hover { background:var(--moss); }
.paywall-overlay { position:fixed; inset:0; background:rgba(26,18,8,0.55); z-index:300; display:flex; align-items:center; justify-content:center; padding:24px; overflow-y:auto; -webkit-overflow-scrolling:touch; }

// ── Markdown Parser ────────────────────────────────────────────────────────
function parseMarkdown(text) {
  const lines = text.split('\n');
  const elements = [];
  let i = 0;
  let key = 0;

  const inlineFormat = (str) => {
    const parts = [];
    let remaining = str;
    let k = 0;
    while (remaining.length > 0) {
      const boldMatch = remaining.match(/\*\*(.+?)\*\*/);
      const italicMatch = remaining.match(/\*(.+?)\*/);
      const firstBold = boldMatch ? remaining.indexOf(boldMatch[0]) : Infinity;
      const firstItalic = italicMatch ? remaining.indexOf(italicMatch[0]) : Infinity;
      if (boldMatch && firstBold <= firstItalic) {
        if (firstBold > 0) parts.push(remaining.slice(0, firstBold));
        parts.push(<strong key={k++}>{boldMatch[1]}</strong>);
        remaining = remaining.slice(firstBold + boldMatch[0].length);
      } else if (italicMatch && firstItalic < Infinity) {
        if (firstItalic > 0) parts.push(remaining.slice(0, firstItalic));
        parts.push(<em key={k++}>{italicMatch[1]}</em>);
        remaining = remaining.slice(firstItalic + italicMatch[0].length);
      } else {
        parts.push(remaining);
        break;
      }
    }
    return parts;
  };

  while (i < lines.length) {
    const line = lines[i];
    if (line.trim() === '' || line === '---') {
      if (line === '---') elements.push(<hr key={key++} />);
      i++; continue;
    }
    // Heading
    if (line.startsWith('### ')) {
      elements.push(<h3 key={key++}>{inlineFormat(line.slice(4))}</h3>); i++; continue;
    }
    if (line.startsWith('## ')) {
      elements.push(<h3 key={key++}>{inlineFormat(line.slice(3))}</h3>); i++; continue;
    }
    // Blockquote
    if (line.startsWith('> ')) {
      elements.push(<blockquote key={key++}>{inlineFormat(line.slice(2))}</blockquote>); i++; continue;
    }
    // Unordered list
    if (line.match(/^[-*] /)) {
      const items = [];
      while (i < lines.length && lines[i].match(/^[-*] /)) {
        items.push(<li key={i}>{inlineFormat(lines[i].slice(2))}</li>);
        i++;
      }
      elements.push(<ul key={key++}>{items}</ul>);
      continue;
    }
    // Ordered list
    if (line.match(/^\d+\. /)) {
      const items = [];
      let counter = 1;
      while (i < lines.length && lines[i].match(/^\d+\. /)) {
        items.push(<li key={i} value={counter}>{inlineFormat(lines[i].replace(/^\d+\. /, ''))}</li>);
counter++;
        i++;
      }
      elements.push(<ol key={key++}>{items}</ol>);
      continue;
    }
    // Regular paragraph
    elements.push(<p key={key++}>{inlineFormat(line)}</p>);
    i++;
  }
  return elements;
}

// ── Audio Analysis ─────────────────────────────────────────────────────────
function analyzeAudio(audioBuffer) {
  const ch = audioBuffer.getChannelData(0);
  const sr = audioBuffer.sampleRate;
  const dur = audioBuffer.duration;

  let sumSq = 0, peak = 0;
  for (let i = 0; i < ch.length; i++) {
    sumSq += ch[i] ** 2;
    if (Math.abs(ch[i]) > peak) peak = Math.abs(ch[i]);
  }
  const rms = Math.sqrt(sumSq / ch.length);

  let cross = 0;
  for (let i = 1; i < ch.length; i++) {
    if ((ch[i] >= 0) !== (ch[i - 1] >= 0)) cross++;
  }
  const zcr = cross / ch.length;

  const frame = Math.floor(sr * 0.05);
  const energies = [];
  for (let i = 0; i + frame < ch.length; i += frame) {
    let e = 0;
    for (let j = 0; j < frame; j++) e += ch[i + j] ** 2;
    energies.push(e / frame);
  }
  const threshold = Math.max(...energies) * 0.1;
  let bursts = 0, inBurst = false;
  for (const e of energies) {
    if (e > threshold && !inBurst) { bursts++; inBurst = true; }
    else if (e <= threshold) inBurst = false;
  }

  // Spectral centroid (simplified)
  const N = Math.min(2048, ch.length);
  let wSum = 0, mag = 0;
  for (let k = 1; k < N / 4; k++) {
    let re = 0, im = 0;
    for (let n = 0; n < N; n++) {
      const a = (2 * Math.PI * k * n) / N;
      re += (ch[n] || 0) * Math.cos(a);
      im -= (ch[n] || 0) * Math.sin(a);
    }
    const m = Math.sqrt(re * re + im * im);
    wSum += (k * sr / N) * m;
    mag += m;
  }
  const centroid = mag > 0 ? wSum / mag : 500;

  const traits = [];
  if (zcr > 0.15) traits.push("high-pitched or dry quality");
  else traits.push("lower-pitched, possibly moist quality");
  if (bursts > 3) traits.push(`repetitive paroxysmal pattern (${bursts} bursts)`);
  else if (bursts === 1) traits.push("single cough impulse");
  else traits.push(`${bursts} cough bursts`);
  if (rms > 0.08) traits.push("forceful/strong intensity");
  else if (rms < 0.02) traits.push("weak or suppressed intensity");
  else traits.push("moderate intensity");
  if (dur > 3) traits.push(`prolonged episode (${dur.toFixed(1)}s)`);
  else traits.push(`brief episode (${dur.toFixed(1)}s)`);
  if (centroid > 1500) traits.push("bright dry spectral character");
  else traits.push("lower spectral energy (possibly wet/rattling)");

  return { dur: dur.toFixed(1), rms: rms.toFixed(3), bursts, centroid: Math.round(centroid), traits };
}

// ── API Call ───────────────────────────────────────────────────────────────
async function callAPI(messages, userToken = '', conversationId = '', userRole = 'client') {
  const browserLang = navigator.language || navigator.userLanguage || 'en';
  const res = await fetch('/api/chat', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ messages, browser_lang: browserLang, user_token: userToken, conversation_id: conversationId, user_role: userRole })
  });
  const data = await res.json();
  if (!res.ok) {
    const err = new Error(data.detail || (typeof data.error === 'string' ? data.error : data.error?.message) || 'Request failed');
    err.status = res.status;
    throw err;
  }
  if (data.error) throw new Error(typeof data.error === 'string' ? data.error : data.error.message);
  return data.content[0].text;
}

      const ctx = new (window.AudioContext || window.webkitAudioContext)();
      const src = ctx.createMediaStreamSource(stream);
      const an = ctx.createAnalyser(); an.fftSize = 64;
      src.connect(an); analyserRef.current = an;

      const chunks = [];
      // Try different mime types for browser compatibility
      const mimeType = MediaRecorder.isTypeSupported('audio/webm;codecs=opus') ? 'audio/webm;codecs=opus'
        : MediaRecorder.isTypeSupported('audio/webm') ? 'audio/webm'
        : MediaRecorder.isTypeSupported('audio/ogg') ? 'audio/ogg' : '';
      const mr = new MediaRecorder(stream, mimeType ? { mimeType } : {});
      mr.ondataavailable = e => { if (e.data.size > 0) chunks.push(e.data); };
      mr.onstop = async () => {
        const blob = new Blob(chunks, { type: mimeType || 'audio/webm' });
        setAudioBlob(blob); setAudioUrl(URL.createObjectURL(blob));
        await ctx.close(); setAnalysis(null); setResult('');
      };
      mr.start(100); mrRef.current = mr;
      setRecording(true); setRecTime(0);
      timerRef.current = setInterval(() => setRecTime(t => t + 1), 1000);

      const tick = () => {
        const data = new Uint8Array(an.frequencyBinCount);
        an.getByteFrequencyData(data);
        setBars(Array.from({ length: 36 }, (_, i) => {
          const idx = Math.floor((i / 36) * data.length);
          return Math.max(3, (data[idx] / 255) * 46);
        }));
        animRef.current = requestAnimationFrame(tick);
      };
      tick();
    } catch (e) {
      setMicError('Microphone access denied. Please allow microphone access in your browser and try again.');
    }
  };

  const stopRec = () => {
    mrRef.current?.stop();
    streamRef.current?.getTracks().forEach(t => t.stop());
    cancelAnimationFrame(animRef.current);
    clearInterval(timerRef.current);
    setRecording(false); setBars(Array(36).fill(3));
  };

  const handleFile = e => {
    const f = e.target.files[0];
    if (!f) return;
    setAudioBlob(f); setAudioUrl(URL.createObjectURL(f));
    setAnalysis(null); setResult('');
  };

  const doAnalyze = async () => {
    if (!audioBlob) return;
    setAnalyzing(true); setResult('');
    try {
      const buf = await audioBlob.arrayBuffer();
      const ctx = new (window.AudioContext || window.webkitAudioContext)();
      let decoded;
      try { decoded = await ctx.decodeAudioData(buf); }
      catch { throw new Error('Could not decode audio. Try recording again or use a different file format (mp3, wav).'); }
      const a = analyzeAudio(decoded);
      setAnalysis(a);
      await ctx.close();

      const prompt = `Cough audio analysis results:
- Duration: ${a.dur} seconds
- RMS amplitude: ${a.rms} (scale 0–1; higher = louder)
- Cough bursts detected: ${a.bursts}
- Spectral centroid: ${a.centroid} Hz
- Acoustic traits: ${a.traits.join(', ')}

Based on these acoustic characteristics, please:
1. Describe what type of cough this profile suggests
2. Recommend the top 3–4 homeopathic remedies from the Material Medica
3. Ask 2 follow-up questions about modalities or accompanying symptoms to refine the recommendation`;

      const reply = await callAPI([{ role: 'user', content: prompt }]);
      setResult(reply);
    } catch (e) {
      setResult(`⚠️ ${e.message}`);
    } finally { setAnalyzing(false); }
  };

  const fmt = s => `${Math.floor(s/60)}:${String(s%60).padStart(2,'0')}`;

          </div>
        </div>

  if (!auth) return loginScreen;

  const continueAsGuest = () => {

  const startCheckout = async (plan) => {

  return (
    <div className="app">

<div className={`sidebar ${sidebarOpen?'open':''}`}>

          <button className="folder-create-btn" disabled={!groupValue.trim()} onClick={()=>assignFolder(groupValue)}>Add</button>

    </div>
  );
})()}
{showPaywall && (
        <div className="paywall-overlay">

            <div className="paywall-brand" translate="no">Logos</div>

{showDisclaimer && (

              <p>Logos is an informational tool only. It does <strong>not</strong> provide medical advice, diagnoses, or prescriptions.</p>

              </ul>
              <div className="disclaimer-emergency">

                <p>IN CASE OF EMERGENCY, call your local emergency services immediately.</p>

            <div style={{fontSize:'12px', color:'var(--muted)', textAlign:'center', marginTop:'16px', lineHeight:'1.6'}}>

            </div>
            <button className="disclaimer-agree-btn" onClick={acceptDisclaimer}>
              I Understand and Agree

      )}

      <header className="header">
        <div className="header-inner">
          <button className="sidebar-btn" onClick={()=>{ setSidebarOpen(true); fetchConversations(); }}>☰</button>
  <div className="brand-icon">🌿</div>
  <div style={{flex:1}}>

  <button

    Sign Out

</div>
      </header>

      <div className="tabs">

          <button className={`tab ${tab==='chat'?'active':''}`} onClick={()=>setTab('chat')}>🌱 Symptom Consultation</button>

      {trialConfig.enforcement && auth?.token && auth?.email !== 'guest' && !auth?.subscribed && (() => {
        const start = auth.trial_started_at ? new Date(auth.trial_started_at).getTime() : Date.now();
        const used = Math.floor((Date.now() - start) / 86400000);
        const left = Math.max(0, trialConfig.trialDays - used);
        return (

      <div className="main">

          {/* ── CHAT TAB ── */}

                )}
                <div ref={endRef} />
              </div>

              

              <div className="input-row">
  <div className="input-wrap" style={{position:'relative'}}>
    <textarea
      placeholder="Describe your symptoms, ask about a remedy…"
      value={input}
      onChange={e=>{ setInput(e.target.value); e.target.style.height='auto'; e.target.style.height=e.target.scrollHeight+'px'; }}
      onKeyDown={e=>{
  if (e.key === 'Enter') {
    if (e.ctrlKey) { e.preventDefault(); send(); return; }
    const now = Date.now();
    if (now - lastEnterRef.current < 500) {
      e.preventDefault();
      send(input.replace(/\n$/, '').trim());
    } else {
      lastEnterRef.current = now;
    }
  }
}}
      rows={1}
      style={{paddingRight:'52px'}}
    />
    <button
      className="send-btn"
      onClick={()=>send()}
      disabled={loading||!input.trim()}
      style={{position:'absolute', right:'8px', top:'50%',transform:'translateY(-50%)',
      width:'36px', height:'36px', borderRadius:'50%',

      display:'flex', alignItems:'center', justifyContent:'center',}}

    >
      {loading ? '…' : (
  <svg width="16" height="16" viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg">

)}

          {/* ── COUGH TAB ── */}

                <div className="recorder-area">

                    <>
                      <div className="rec-timer">{fmt(recTime)}</div>

                <div className="card" style={{textAlign:'center',padding:28}}>

                  <div className="result-text">{parseMarkdown(result)}</div>

        </div>
        <div style={{textAlign:'center', padding:'1rem', fontSize:'0.75rem', color:'#5a6b50'}}>
          <a href="/terms" style={{color:'#7ab88a', marginRight:'1rem'}}>Terms of Service</a>
